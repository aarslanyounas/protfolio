<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:500px;overflow:hidden}
.c{position:relative;width:2000px;height:500px;overflow:hidden;background:#fdfcff;font-family:Inter,sans-serif;color:#16131f;
 background-image:linear-gradient(rgba(40,20,80,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(40,20,80,.03) 1px,transparent 1px);background-size:34.25px 34.2px;background-position:27.5px 24.8px}
.pill{position:absolute;left:43px;top:44px;display:flex;align-items:center;gap:13px;height:52px;padding:0 28px 0 23px;border-radius:999px;background:#7c4dff;color:#fff;font:600 20px/1 Inter;box-shadow:0 8px 16px -10px rgba(124,77,255,.8)}
.pill i{width:8px;height:8px;border-radius:50%;background:#fff}
.motto{position:absolute;left:47px;top:134px;font:500 15px/1 "Geist Mono";letter-spacing:.06em;color:#3b3646}
.ruler{position:absolute;left:0;top:0;height:48px;width:2000px}
.ruler span{position:absolute;top:0;width:1.5px;background:#16131f}
.st{position:absolute;top:52px;transform:translateX(-50%);font:500 16px/1 Inter;color:#16131f;white-space:nowrap}
.st.now{font-weight:700}
.st.first{color:#7c4dff;font-weight:600}
.pre{position:absolute;left:721px;top:156px;font:italic 400 44px/1 "Instrument Serif";color:#16131f;letter-spacing:-.005em}
h1{position:absolute;left:706px;top:200px;font:800 128px/1.08 Inter;letter-spacing:-.035em;white-space:nowrap;color:transparent;background:linear-gradient(90deg,#16131f 0%,#2e1a5e 16%,#7c4dff 44%,#b14dff 68%,#ff4d9d 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 5px rgba(22,19,31,.25))}
.post{position:absolute;top:333px;font:400 32px/1 Inter;color:#16131f;letter-spacing:-.01em}
.handle{position:absolute;top:424px;display:flex;align-items:center;gap:12px;font:600 16px/1 Inter}
.handle i{width:60px;height:1.4px;background:#16131f}
.handle b{padding:8px 14px;border:1.5px solid #16131f;border-radius:999px;color:#16131f}
/* Figma-style selection around the headline */
.sel{position:absolute;border:1.5px solid #7c4dff;pointer-events:none}
.sel s{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid #7c4dff}
.sel .tag{position:absolute;left:-1.5px;bottom:-30px;background:#7c4dff;color:#fff;font:600 12px/1 "Geist Mono";padding:6px 8px;border-radius:0 4px 4px 4px;letter-spacing:.04em}
.cur{position:absolute;display:flex;align-items:flex-start;gap:2px}
.cur em{margin-top:20px;background:#ff4d9d;color:#fff;font:600 13px/1 Inter;font-style:normal;padding:6px 10px;border-radius:4px 10px 10px 10px}
.tiles{position:absolute;left:1560px;top:-26px;width:440px;height:560px;-webkit-mask:linear-gradient(90deg,transparent 0,#000 26%);mask:linear-gradient(90deg,transparent 0,#000 26%)}
.t{position:absolute;width:54px;height:54px;border-radius:15px;background:#fff;display:grid;place-items:center;
 box-shadow:0 1px 1px rgba(22,19,31,.06),0 6px 12px -4px rgba(22,19,31,.14),inset 0 -3px 0 rgba(22,19,31,.04)}
.t::after{content:"";position:absolute;left:8px;right:8px;bottom:-9px;height:12px;border-radius:50%;background:var(--g);filter:blur(7px);opacity:.38;z-index:-1}
.t svg{width:26px;height:26px}
</style></head><body><div class="c">
<div class="pill"><i></i>Let’s Create Together</div>
<div class="motto">Turning Ideas Into Identity</div>
<svg style="position:absolute;left:338px;top:64px;width:44px;height:84px" viewBox="0 0 44 84" fill="none" stroke="#16131f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 76 C 34 70, 42 30, 12 10" stroke-dasharray="4 5"/><path d="M12 10 L22 7 M12 10 L15 20"/></svg>
<div class="ruler" id="ruler"></div>
<div class="pre">Ideas become brands</div>
<h1 id="h">BY DESIGN</h1>
<div class="post" id="post">Make it unforgettable.</div>
<div class="handle" id="handle"><i></i><b>@amnayounas</b></div>
<div class="tiles" id="tiles"></div>
</div>
<script src="icons.js"></script>
<script>
var C=document.querySelector(".c");
// process ruler: Idea → Launch (current stage bold)
var steps=["Idea","Sketch","Wireframe","Design","Prototype","Launch"],gap=120,x0=700,R=document.getElementById("ruler"),h="";
for(var k=0;k<steps.length;k++){var x=x0+k*gap,st=k==0?'background:repeating-linear-gradient(#7c4dff 0 4px,transparent 4px 8px);height:34px':k==3?'height:44px;width:2.5px':'height:34px';
 h+='<span style="left:'+x+'px;'+st+'"></span>';
 if(k<steps.length-1)for(var j=1;j<5;j++)h+='<span style="left:'+(x+j*gap/5)+'px;height:16px;'+(k==0?'background:#cbb8ff':'')+'"></span>';
 var d=document.createElement("div");d.className="st"+(k==0?" first":k==3?" now":"");d.textContent=steps[k];d.style.left=(x+1)+"px";C.appendChild(d);}
R.innerHTML=h;
document.fonts.ready.then(function(){
 var H=document.getElementById("h"),r=H.getBoundingClientRect(),right=r.left+r.width;
 var p=document.getElementById("post");p.style.left=(right-p.offsetWidth)+"px";
 var hd=document.getElementById("handle");hd.style.left=(r.left+r.width/2-hd.offsetWidth/2+60)+"px";
 // selection box around headline
 var s=document.createElement("div");s.className="sel";var pad=10,top=r.top+20,bot=r.top+r.height-12;
 s.style.cssText+="left:"+(r.left-pad)+"px;top:"+top+"px;width:"+(r.width+pad*2)+"px;height:"+(bot-top)+"px";
 s.innerHTML='<s style="left:-6.5px;top:-6.5px"></s><s style="right:-6.5px;top:-6.5px"></s><s style="left:-6.5px;bottom:-6.5px"></s><s style="right:-6.5px;bottom:-6.5px"></s>';
 C.appendChild(s);
 document.body.setAttribute("data-ready","1");
});
// tool tiles
Promise.resolve(window.ICONS).then(function(ic){
 var T=document.getElementById("tiles"),cols=5,pitch=80,html="";
 ic.forEach(function(o,i){var c=i%cols,r=Math.floor(i/cols);
  html+='<div class="t" style="left:'+(70+c*pitch)+'px;top:'+(30+r*pitch)+'px;--g:#'+o.hex+'"><svg viewBox="0 0 24 24"><path fill="#'+o.hex+'" d="'+o.path+'"/></svg></div>';});
 T.innerHTML=html;document.body.setAttribute("data-tiles","1");});
</script>
</body></html>
