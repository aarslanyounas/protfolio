<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1200px;overflow:hidden}
.c{position:relative;width:1200px;height:1200px;overflow:hidden;background:#f6f3fc}
.c::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(40,20,80,.06) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(40,20,80,.06) 1.5px,transparent 1.5px);background-size:80px 80px;background-position:40px 40px;-webkit-mask:radial-gradient(circle at 50% 42%,#000 40%,transparent 78%);mask:radial-gradient(circle at 50% 42%,#000 40%,transparent 78%)}
.sun{position:absolute;left:50%;top:41%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a07bff,#7c4dff 55%,#b14dff 85%,#ff4d9d)}
.sel{position:absolute;left:150px;top:42px;width:900px;height:900px;border:3px solid rgba(124,77,255,.55);z-index:1}
.sel s{position:absolute;width:26px;height:26px;background:#fff;border:3px solid #7c4dff}
.cur{position:absolute;left:820px;top:150px;z-index:4;display:flex;align-items:flex-start;gap:4px}
.cur em{margin-top:44px;background:#ff4d9d;color:#fff;font:600 34px/1 Inter;font-style:normal;padding:12px 20px;border-radius:8px 20px 20px 20px;box-shadow:0 10px 20px -10px rgba(255,77,157,.7)}
img{position:absolute;left:50%;bottom:-30px;width:1190px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 26px 30px rgba(22,19,31,.22))}
</style></head><body><div class="c"><span class="sun"></span>
<span class="sel"><s style="left:-14px;top:-14px"></s><s style="right:-14px;top:-14px"></s><s style="left:-14px;bottom:-14px"></s><s style="right:-14px;bottom:-14px"></s></span>
<img src="cutout-stroked.png">
<div class="cur"><svg width="56" height="60" viewBox="0 0 26 28"><path d="M3 2 L22 14 L13 15.5 L8.5 24 Z" fill="#ff4d9d" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg><em>Amna</em></div>
</div></body></html>
