# Render Blueprint: static site served from sites/render.
# The service name sets the URL: https://arslanyounas.onrender.com (if the name is free).
services:
  - type: web
    name: arslanyounas
    runtime: static
    rootDir: sites/render
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    buildFilter:
      paths:
        - sites/render/**
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
