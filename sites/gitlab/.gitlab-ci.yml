# GitLab Pages: publishes the "public" folder of this project.
# Project must be named arslanyounas.gitlab.io under the arslanyounas namespace.
image: alpine:latest

pages:
  stage: deploy
  script:
    - echo "Publishing static site from public/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
