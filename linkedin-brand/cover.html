<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:500px;overflow:hidden;font-family:Inter,sans-serif}
.c{position:relative;width:2000px;height:500px;overflow:hidden;background:url(source-cover.webp) 0 0/2000px 500px no-repeat}
/* clean panel over old content, recreating the same grid */
.clean{position:absolute;left:0;top:0;width:1620px;height:500px;background:#fdfdfd;
 background-image:linear-gradient(rgba(0,0,0,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.028) 1px,transparent 1px);background-size:34.25px 34.2px;background-position:27.5px 24.8px;
 -webkit-mask:linear-gradient(90deg,#000 94%,transparent);mask:linear-gradient(90deg,#000 94%,transparent)}
.pill{position:absolute;left:43px;top:44px;width:272px;height:52px;border-radius:999px;background:linear-gradient(180deg,#ff6a2b,#f2470d);color:#fff;display:flex;align-items:center;gap:14px;padding-left:24px;font:600 20px/1 Inter;box-shadow:0 10px 18px -8px rgba(242,71,13,.75),inset 0 1px 0 rgba(255,255,255,.25)}
.pill i{width:9px;height:9px;border-radius:50%;background:#fff}
.motto{position:absolute;left:49px;top:137px;font:600 19px/1 Inter;color:#121211;letter-spacing:-.005em}
.arrow{position:absolute;left:326px;top:82px;width:30px;height:70px}
.ruler{position:absolute;left:740px;top:0;height:48px}
.ruler span{position:absolute;top:0;width:2px;background:#121211}
.yr{position:absolute;top:47px;font:500 17px/1 Inter;color:#121211}
.now{position:absolute;left:692px;top:58px;width:96px;height:38px}
.now svg{position:absolute;inset:-4px -6px;width:108px;height:46px}
.now b{position:absolute;inset:0;display:grid;place-items:center;font:700 21px/1 Inter;color:#121211}
.pre{position:absolute;left:721px;top:166px;font:400 33px/1 Inter;color:#121211;letter-spacing:-.01em}
h1{position:absolute;left:706px;top:200px;font:800 128px/1 Inter;letter-spacing:-.035em;white-space:nowrap;
 background:linear-gradient(90deg,#ff8a3d 0%,#ff4f12 38%,#c93a07 66%,#121211 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 5px rgba(18,18,17,.18))}
.post{position:absolute;right:582px;top:325px;font:400 32px/1 Inter;color:#121211;letter-spacing:-.01em}
.handle{position:absolute;left:977px;top:430px;display:flex;align-items:center;gap:6px;font:500 17px/1 Inter;color:#121211}
.handle i{width:60px;height:1.4px;background:#121211}
</style></head><body><div class="c">
<div class="clean"></div>
<div class="pill"><i></i>Let’s Move Forward</div>
<svg class="arrow" viewBox="0 0 30 70" fill="none" stroke="#121211" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"><path d="M10 6 C 26 20, 26 46, 6 64"/><path d="M5 10 L10 5 L14 11" stroke-dasharray="0"/></svg>
<div class="motto">Turning Strategy Into Destiny</div>
<div class="ruler" id="ruler"></div>
<div class="now"><svg viewBox="0 0 108 46"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff4f12"/><stop offset="1" stop-color="#121211"/></linearGradient></defs><ellipse cx="54" cy="23" rx="51" ry="19" fill="none" stroke="url(#g)" stroke-width="3.2" transform="rotate(-6 54 23)"/></svg><b>2026</b></div>
<div class="pre">Future is moving</div>
<h1>AI ENGINES</h1>
<div class="post">It’s time to 301.</div>
<div class="handle"><i></i>@arslanyounas</div>
</div>
<script>
var R=document.getElementById("ruler"),h="",gap=86.4,yrs=[2026,2025,2024,2023,2022,2021,2020,2019];
for(var k=0;k<yrs.length;k++){var x=k*gap;h+='<span style="left:'+x+'px;height:'+(k==0?48:34)+'px"></span>';
  if(k<yrs.length-1)for(var m=1;m<4;m++)h+='<span style="left:'+(x+m*gap/4)+'px;height:20px"></span>';}
R.innerHTML=h;var C=document.querySelector(".c");
yrs.forEach(function(y,k){if(!k)return;var d=document.createElement("div");d.className="yr";d.textContent=y;d.style.left=(740+k*gap-21)+"px";C.appendChild(d)});
</script>
</body></html>
