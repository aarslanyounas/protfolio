<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:500px;overflow:hidden}
.c{position:relative;width:2000px;height:500px;overflow:hidden;background:url(source-cover-2x.png) 0 0/2000px 500px no-repeat;font-family:Inter,sans-serif;color:#121211}
.bg{position:absolute;left:0;top:0;width:1630px;height:500px;background:#fdfdfd;
 background-image:linear-gradient(rgba(0,0,0,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.028) 1px,transparent 1px);background-size:34.25px 34.2px;background-position:27.5px 24.8px;
 -webkit-mask:linear-gradient(90deg,#000 94%,transparent);mask:linear-gradient(90deg,#000 94%,transparent)}
.pill{position:absolute;left:43px;top:44px;display:flex;align-items:center;gap:13px;height:52px;padding:0 28px 0 23px;border-radius:999px;background:#e5232b;color:#fff;font:600 20px/1 Inter;box-shadow:0 8px 16px -10px rgba(229,35,43,.7)}
.pill i{width:8px;height:8px;border-radius:50%;background:#fff}
.motto{position:absolute;left:47px;top:134px;font:500 15px/1 "Geist Mono";letter-spacing:.06em;color:#3a3936}
.motto span{color:#ff4f12}
.ruler{position:absolute;left:760px;top:0;height:48px}
.ruler span{position:absolute;top:0;width:1.5px;background:#121211}
.yr{position:absolute;top:50px;font:500 16px/1 Inter;color:#121211}
.yr.now{font-weight:700}
.yr.soon{color:#ff4f12;font-weight:600}
.yr.soon small{display:block;margin-top:5px;font:500 11px/1 "Geist Mono";letter-spacing:.1em;text-transform:uppercase;color:#a3a19b}
.pre{position:absolute;left:721px;top:166px;font:400 33px/1 Inter;color:#121211;letter-spacing:-.01em}
h1{position:absolute;left:706px;top:200px;font:800 128px/1.08 Inter;letter-spacing:-.035em;white-space:nowrap;color:transparent;background:linear-gradient(90deg,#121211 0%,#3b1b0f 16%,#ff4f12 42%,#ff6d2e 66%,#e5232b 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 5px rgba(18,18,17,.28))}

.post{position:absolute;right:582px;top:325px;font:400 32px/1 Inter;color:#121211;letter-spacing:-.01em}
.handle{position:absolute;left:977px;top:424px;display:flex;align-items:center;gap:12px;font:500 16px/1 Inter;color:#6b6a65}
.handle i{width:60px;height:1.4px;background:#121211}
.handle b{padding:8px 14px;border:1.5px solid #121211;border-radius:999px;color:#121211;font-weight:600}
</style></head><body><div class="c">
<div class="bg"></div>
<div class="pill"><i></i>Let’s Move Forward</div>
<div class="motto">Turning Strategy Into Destiny</div>
<svg style="position:absolute;left:338px;top:64px;width:44px;height:84px" viewBox="0 0 44 84" fill="none" stroke="#121211" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 76 C 34 70, 42 30, 12 10" stroke-dasharray="4 5"/><path d="M12 10 L22 7 M12 10 L15 20"/></svg>
<div class="ruler" id="ruler"></div>
<div class="pre">Future is moving</div>
<h1>AI ENGINES</h1>
<div class="post">It’s time to 301.</div>
<div class="handle"><i></i><b>@arslanyounas</b></div>
</div>
<script>
var R=document.getElementById("ruler"),h="",gap=84,yrs=[2027,2026,2025,2024,2023,2022,2021,2020,2019],C=document.querySelector(".c");
for(var k=0;k<yrs.length;k++){var x=(k-1)*gap,st=k==0?'background:repeating-linear-gradient(#ff4f12 0 4px,transparent 4px 8px);height:34px':k==1?'height:44px;width:2.5px':'height:34px';
 h+='<span style="left:'+x+'px;'+st+'"></span>';
 if(k<yrs.length-1)for(var j=1;j<4;j++)h+='<span style="left:'+(x+j*gap/4)+'px;height:16px;'+(k==0?'background:#f2c3ad':'')+'"></span>';}
R.innerHTML=h;
yrs.forEach(function(y,k){var d=document.createElement("div");d.className="yr"+(k==0?" soon":k==1?" now":"");d.innerHTML=y;d.style.left=(760+(k-1)*gap-19)+"px";C.appendChild(d)});
</script>
</body></html>
