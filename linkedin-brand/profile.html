<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1200px;overflow:hidden}
.c{position:relative;width:1200px;height:1200px;overflow:hidden;background:#f4f1ea}
.c::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(18,18,17,.06) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(18,18,17,.06) 1.5px,transparent 1.5px);background-size:80px 80px;background-position:40px 40px;-webkit-mask:radial-gradient(circle at 50% 42%,#000 40%,transparent 78%);mask:radial-gradient(circle at 50% 42%,#000 40%,transparent 78%)}
.sun{position:absolute;left:50%;top:41%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a3d,#ff4f12 60%,#e8430a)}
.orbit{position:absolute;left:50%;top:41%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;border:3px dashed rgba(18,18,17,.28);z-index:1}
.pin{position:absolute;left:880px;top:150px;width:30px;height:30px;border-radius:50%;background:#121211;border:7px solid #f4f1ea;box-shadow:0 0 0 3px #121211;z-index:2}
img{position:absolute;left:50%;bottom:-40px;width:1180px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 26px 30px rgba(18,18,17,.22))}
</style></head><body><div class="c"><span class="sun"></span><span class="orbit"></span><span class="pin"></span><img src="cutout-stroked.png"></div></body></html>
