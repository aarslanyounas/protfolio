<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden}
.c{position:relative;width:1080px;height:1080px;overflow:hidden;background:#fcfcfc;
 background-image:linear-gradient(rgba(18,18,17,.045) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(18,18,17,.045) 1.5px,transparent 1.5px);background-size:92px 92px;background-position:46px 46px}
.glow{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,1) 0,rgba(255,255,255,.85) 40%,rgba(255,255,255,0) 70%)}
.arc{position:absolute;left:50%;top:43%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;border:3px solid transparent;border-top-color:rgba(255,79,18,.85);border-right-color:rgba(255,79,18,.25);transform:rotate(-30deg)}
img{position:absolute;left:50%;bottom:-14px;width:1030px;transform:translateX(-50%);filter:drop-shadow(0 22px 34px rgba(18,18,17,.18)) drop-shadow(0 4px 8px rgba(18,18,17,.10))}
</style></head><body><div class="c"><span class="glow"></span><span class="arc"></span><img src="cutout-hd.png"></div></body></html>
